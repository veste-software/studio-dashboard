<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-BcyDZGWTOQ6r6EsjTpAGoNQwFqoFpOxX+fWH/AIFUpQ='; style-src 'sha256-XkQC+9KMqtelSrj6HOpXCp8n+8fJTh0vqH3tNr0CRA8='; connect-src https://studio-console.data-vestesoftware.workers.dev; base-uri 'none'; form-action 'none'">
<title>Studio console</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --ink: #14181f; --muted: #5b6573; --line: #dde1e7;
  --good: #0f7b4d; --good-bg: #e2f4ea; --bad: #b3261e; --bad-bg: #fbe3e1; --warn: #8a6100; --warn-bg: #fbf0d0;
  --accent: #2456d6; --accent-ink: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --card: #181c22; --ink: #e8ebf0; --muted: #9aa4b2; --line: #2a303a;
    --good: #52d19a; --good-bg: #12301f; --bad: #ff8a80; --bad-bg: #3a1714; --warn: #e2b64a; --warn-bg: #33290d;
    --accent: #8fb0ff; --accent-ink: #0f1216;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 22px; margin: 0; }
h2 { font-size: 16px; margin: 32px 0 10px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.muted { color: var(--muted); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 0 0 12px; }
.card h3 { font-size: 16px; margin: 0 0 2px; }
.card p { margin: 6px 0; }
.card ul { margin: 6px 0 10px; padding-left: 18px; color: var(--muted); font-size: 13px; }
.kind { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: 1px 8px; margin-bottom: 6px; background: var(--warn-bg); color: var(--warn); }
.kind.launch { background: var(--good-bg); color: var(--good); }
.kind.parked { background: var(--bad-bg); color: var(--bad); }
.kind.prototype { background: var(--good-bg); color: var(--good); }
.grow { flex: 1 1 220px; }
.full { flex: 1 1 100%; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-top: 8px; }
label { display: block; font-size: 12px; color: var(--muted); }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
input[type=password], input[type=text], input[type=url], textarea { width: 100%; }
button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 14px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { color: var(--bad); }
button.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
a { color: var(--accent); }
.msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
.msg.ok { background: var(--good-bg); color: var(--good); }
.msg.err { background: var(--bad-bg); color: var(--bad); }
[hidden] { display: none !important; }
details { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; }
summary { cursor: pointer; font-weight: 600; }
#log { list-style: none; padding: 0; margin: 0; }
.rec { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; background: var(--bg); }
.rec.pursue { background: var(--good-bg); border-color: var(--good); }
.rec.drop { background: var(--bad-bg); border-color: var(--bad); }
.rec.call { background: var(--warn-bg); border-color: var(--warn); }
.rec b { display: block; }
.rec h4 { margin: 8px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.rec ul { margin: 2px 0 4px; padding-left: 18px; color: var(--ink); font-size: 13px; }
.sec { margin: 6px 0; padding: 6px 12px; }
.sec summary { font-size: 14px; }
.sec p { margin: 6px 0; font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <button id="logout" hidden>Log out</button>
  </header>

  <p id="status" class="msg" role="status" hidden></p>

  <section id="login" hidden>
    <div class="card">
      <p>Enter the console password (<code>DASHBOARD_PW</code> in <code>.env</code>).</p>
      <form id="loginForm">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" required>
        <div class="row"><button class="primary" type="submit">Log in</button></div>
      </form>
      <div id="loginMsg" class="msg err" role="alert" hidden></div>
    </div>
    <p class="muted" id="where"></p>
  </section>

  <section id="app" hidden>
    <p class="muted" id="count"></p>
    <div id="decisions"></div>

    <h2>Add an idea</h2>
    <details>
      <summary>Put your own idea at the front of the queue</summary>
      <form id="ideaForm">
        <div class="row">
          <div class="grow"><label for="ideaTitle">Title</label><input id="ideaTitle" type="text" maxlength="120" required></div>
          <div><label for="ideaPlatform">Platform</label><select id="ideaPlatform"></select></div>
        </div>
        <div class="row"><div class="full"><label for="ideaPitch">What is it, and who is it for?</label><textarea id="ideaPitch" rows="3" maxlength="500"></textarea></div></div>
        <div class="row"><button class="primary" type="submit">Add idea</button></div>
        <p class="muted">The Product lead and the review panel still judge it, and either can decline it.</p>
      </form>
    </details>

    <h2>The studio</h2>
    <div class="row">
      <button id="stop" class="danger">Stop all passes</button>
      <button id="resume">Resume</button>
    </div>
    <p class="muted">Stopping creates the STOP file: nothing runs until you resume.</p>

    <h2>What you just did</h2>
    <ul id="log" aria-live="polite"></ul>
  </section>
</main>

<script>
(function () {
  'use strict';
  // Never run inside someone else's frame.
  if (window.top !== window.self) { document.documentElement.textContent = ''; return; }
  var MODE = 'relay';
  var API = 'https://studio-console.data-vestesoftware.workers.dev';
  var csrf = '';
  var token = '';
  var timer = null;
  var armed = null;
  var pending = {};
  var $ = function (id) { return document.getElementById(id); };

  function h(tag, props, kids) {
    var el = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === 'text') el.textContent = props[k];
      else if (k === 'class') el.className = props[k];
      else el.setAttribute(k, props[k]);
    });
    (kids || []).forEach(function (c) { if (c) el.append(c); });
    return el;
  }
  function safeLink(url, label) {
    if (typeof url !== 'string' || !/^https:\/\//i.test(url)) return null;
    var a = h('a', { text: label, rel: 'noopener noreferrer', target: '_blank' });
    a.setAttribute('href', url);
    return a;
  }
  function api(method, path, body) {
    var headers = {};
    if (body) headers['content-type'] = 'application/json';
    var init = { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' };
    if (MODE === 'relay') {
      if (token) headers.authorization = 'Bearer ' + token;
      init.credentials = 'omit';
    } else {
      headers['x-csrf'] = csrf;
      init.credentials = 'same-origin';
    }
    return fetch(API + path, init)
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, body: j }; }); })
      .catch(function () { return { status: 0, body: {} }; });
  }
  function say(text, ok) {
    var li = h('li', { class: 'msg ' + (ok ? 'ok' : 'err'), text: text });
    var log = $('log');
    log.prepend(li);
    while (log.children.length > 8) log.lastChild.remove();
  }

  /* BEGIN PROOF */
  function toHex(buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }
  function fromHex(text) {
    var out = new Uint8Array(text.length / 2);
    for (var i = 0; i < out.length; i += 1) out[i] = parseInt(text.substr(i * 2, 2), 16);
    return out;
  }
  function deriveProof(password, saltHex, iterations) {
    var subtle = (self.crypto || {}).subtle;
    if (!subtle) return Promise.reject(new Error('nocrypto'));
    return subtle.importKey('raw', new TextEncoder().encode(String(password).normalize('NFC')), 'PBKDF2', false, ['deriveBits'])
      .then(function (key) { return subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: fromHex(saltHex), iterations: iterations }, key, 256); })
      .then(toHex);
  }
  /* END PROOF */

  function loginRequest(pw) {
    if (MODE !== 'relay') return api('POST', '/api/login', { password: pw });
    return api('GET', '/api/salt').then(function (r) {
      var it = r.body && r.body.iterations;
      if (r.status !== 200) return { status: r.status, body: {} };
      // The relay chooses the work factor, so bound it: a hostile answer must not freeze the page.
      if (!/^[0-9a-f]{32}$/.test(String(r.body.salt)) || !(it >= 100000 && it <= 2000000)) return { status: 0, body: {} };
      return deriveProof(pw, r.body.salt, it)
        .then(function (proof) { return api('POST', '/api/login', { proof: proof }); })
        .catch(function () { return { status: -1, body: {} }; });
    }).then(function (r) {
      if (r.status === 200 && r.body.token) { token = r.body.token; r.body.ok = true; }
      return r;
    });
  }

  function show(authed) {
    $('login').hidden = authed;
    $('app').hidden = !authed;
    $('logout').hidden = !authed;
    if (!authed) { token = ''; csrf = ''; pending = {}; $('status').hidden = true; }
    if (!authed && timer) { clearTimeout(timer); timer = null; }
  }

  // One place that sends a decision and tells you what happened. On the relay a decision is
  // queued and applied by the studio a little later; the result arrives with the next refresh.
  function send(req, label, then) {
    return api('POST', '/api/command', req).then(function (r) {
      if (r.status === 401) { show(false); return; }
      if (r.body.queued) {
        pending[r.body.id] = label;
        var late = r.body.studioSeenSecondsAgo === null || r.body.studioSeenSecondsAgo > 180;
        say('Sent: ' + label + '. The studio applies it when it next checks in' + (late ? ' (it has not checked in lately, so this may wait).' : '.'), true);
      } else {
        say(r.body.ok ? r.body.message : ('Not done: ' + (r.body.error || (r.status === 0 ? 'cannot reach the console' : 'something went wrong'))), Boolean(r.body.ok));
      }
      if (then) then(r);
      load();
    });
  }

  function field(f, values) {
    var id = 'f' + Math.random().toString(36).slice(2, 8);
    var input;
    if (f.options) {
      input = h('select', { id: id }, f.options.map(function (o) { return h('option', { value: o, text: o }); }));
      if (f.default) input.value = f.default;
    } else {
      input = h('input', { id: id, type: 'text', maxlength: '300' });
    }
    values[f.name] = input;
    return h('div', { class: 'grow' }, [h('label', { for: id, text: f.label }), input]);
  }

  function actionButton(d, a, values) {
    var needsConfirm = a.danger || (d.kind === 'launch' && a.action === 'approve');
    var b = h('button', { class: a.danger ? 'danger' : 'primary', text: a.label });
    b.addEventListener('click', function () {
      if (needsConfirm && armed !== b) {
        if (armed) { armed.className = armed.dataset.cls; armed.textContent = armed.dataset.label; }
        armed = b;
        b.dataset.cls = b.className; b.dataset.label = b.textContent;
        b.className = 'armed'; b.textContent = 'Click again to confirm: ' + a.label;
        setTimeout(function () { if (armed === b) { b.className = b.dataset.cls; b.textContent = b.dataset.label; armed = null; } }, 5000);
        return;
      }
      armed = null;
      var req = { action: a.action, id: d.productId };
      Object.keys(a.params || {}).forEach(function (k) { req[k] = a.params[k]; });
      Object.keys(values).forEach(function (k) { req[k] = values[k].value; });
      b.disabled = true;
      send(req, a.label + ': ' + d.title, function () { b.disabled = false; });
    });
    return b;
  }

  function lineEl(l) {
    var a = l.url ? safeLink(l.url, ' open') : null;
    var p = h('p', { text: l.text });
    if (a) p.append(a);
    return p;
  }
  function recBox(r) {
    if (!r) return null;
    var kids = [h('b', { text: r.headline })];
    [['For', r.for], ['Against', r.against], ['Not known', r.unknown]].forEach(function (g) {
      if (!g[1] || !g[1].length) return;
      kids.push(h('h4', { text: g[0] }));
      kids.push(h('ul', {}, g[1].map(function (t) { return h('li', { text: t }); })));
    });
    kids.push(h('div', { class: 'muted', text: r.note }));
    return h('div', { class: 'rec ' + (r.verdict === 'your call' ? 'call' : r.verdict) }, kids);
  }
  function sectionEls(secs) {
    return (secs || []).map(function (sec) {
      var el = h('details', { class: 'sec' }, [h('summary', { text: sec.label })].concat((sec.lines || []).map(lineEl)));
      if (sec.open) el.setAttribute('open', '');
      return el;
    });
  }

  function card(d) {
    var values = {};
    var fields = [];
    d.actions.forEach(function (a) { (a.fields || []).forEach(function (f) { if (!values[f.name]) fields.push(field(f, values)); }); });
    var links = (d.links || []).map(function (l) { return safeLink(l.url, l.label); }).filter(Boolean);
    var linkLine = h('p', {});
    links.forEach(function (a, i) { if (i) linkLine.append(' · '); linkLine.append(a); });
    var kids = [
      h('span', { class: 'kind ' + d.kind, text: d.kind === 'launch' ? 'Ready to launch' : d.kind === 'prototype' ? 'One-day prototype' : d.kind === 'idea' ? 'Idea to approve' : d.kind === 'parked' ? 'Paused' : 'Task for you' }),
      h('h3', { text: d.title }),
      h('p', { text: d.text }),
      recBox(d.recommendation),
      h('ul', {}, (d.facts || []).map(function (t) { return h('li', { text: t }); })),
    ].concat(sectionEls(d.sections));
    if (links.length) kids.push(linkLine);
    if (fields.length) kids.push(h('div', { class: 'row' }, fields));
    kids.push(h('div', { class: 'row' }, d.actions.map(function (a) { return actionButton(d, a, values); })));
    return h('div', { class: 'card' }, kids);
  }

  function ago(seconds) {
    if (seconds < 90) return seconds + ' s';
    if (seconds < 5400) return Math.round(seconds / 60) + ' min';
    return Math.round(seconds / 3600) + ' h';
  }

  // Relay only: is the studio on your machine connected, and did it deal with what you sent?
  function relayStatus(body) {
    var el = $('status');
    var seen = body.studioSeenSecondsAgo;
    var text;
    var ok = false;
    if (seen === null || seen === undefined) text = 'The studio has not connected to the relay yet. Decisions you send wait until it does.';
    else if (seen > 180) text = 'The studio last checked in ' + ago(seen) + ' ago. Decisions you send wait until it is back.';
    else { ok = true; text = 'The studio is connected (checked in ' + ago(seen) + ' ago).'; }
    if (body.queued) text += ' ' + body.queued + ' decision(s) are waiting for it.';
    el.textContent = text;
    el.className = 'msg ' + (ok ? 'ok' : 'err');
    el.hidden = false;
    (body.recent || []).slice().reverse().forEach(function (res) {
      if (pending[res.id] === undefined) return;
      say((res.ok ? 'Done: ' : 'Not done: ') + (res.message || res.error || pending[res.id]), Boolean(res.ok));
      delete pending[res.id];
    });
  }

  function schedule() {
    if (timer) clearTimeout(timer);
    var fast = Object.keys(pending).length > 0;
    timer = setTimeout(function () { if (!document.hidden && !armed) load(); else schedule(); }, fast ? 5000 : 60000);
  }

  function load() {
    return api('GET', '/api/decisions').then(function (r) {
      if (r.status === 401) { show(false); return; }
      if (r.status !== 200) { $('count').textContent = 'Cannot reach the console right now.'; schedule(); return; }
      show(true);
      if (MODE === 'relay') relayStatus(r.body);
      var list = $('decisions');
      list.textContent = '';
      var ds = r.body.decisions || [];
      $('count').textContent = ds.length ? ds.length + ' thing(s) waiting for you.' : 'Nothing is waiting for you.';
      ds.forEach(function (d) { list.append(card(d)); });
      var sel = $('ideaPlatform');
      if (!sel.children.length) (r.body.platforms || []).forEach(function (p) { sel.append(h('option', { value: p, text: p })); });
      schedule();
    });
  }

  function start() {
    show(true);
    load();
  }

  $('title').textContent = document.title;
  $('where').textContent = MODE === 'relay'
    ? 'Your password is checked in this browser and never sent. What you decide is queued and applied by the studio on your machine within about half a minute.'
    : 'This page is served to this machine only. It changes the studio, so it asks for the password.';

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var msg = $('loginMsg');
    var button = e.target.querySelector('button');
    msg.hidden = true;
    button.disabled = true;
    loginRequest($('pw').value).then(function (r) {
      button.disabled = false;
      $('pw').value = '';
      if (r.body.ok) { csrf = r.body.csrf || ''; start(); return; }
      msg.textContent = r.status === 429
        ? 'Too many wrong passwords. Try again in about ' + Math.ceil((r.body.retryAfterSeconds || 60) / 60) + ' minute(s).'
        : r.status === 401 ? 'That password is not right.'
          : r.status === 503 ? 'The relay is not set up yet.'
            : r.status === -1 ? 'This browser cannot do the password check (it needs a secure https page).'
              : 'Cannot reach the console right now.';
      msg.hidden = false;
    });
  });
  $('logout').addEventListener('click', function () { api('POST', '/api/logout').then(function () { show(false); }); });
  $('stop').addEventListener('click', function () {
    var b = $('stop');
    if (armed !== b) { armed = b; b.className = 'armed'; b.textContent = 'Click again to confirm: stop all passes'; setTimeout(function () { if (armed === b) { armed = null; b.className = 'danger'; b.textContent = 'Stop all passes'; } }, 5000); return; }
    armed = null; b.className = 'danger'; b.textContent = 'Stop all passes';
    send({ action: 'stop' }, 'Stop all passes');
  });
  $('resume').addEventListener('click', function () { send({ action: 'resume' }, 'Resume'); });
  $('ideaForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var title = $('ideaTitle').value;
    send({ action: 'add-idea', title: title, platform: $('ideaPlatform').value, pitch: $('ideaPitch').value }, 'Add idea "' + title + '"', function (r) {
      if (r.body.ok) { $('ideaTitle').value = ''; $('ideaPitch').value = ''; }
    });
  });

  if (MODE === 'relay') show(false);
  else api('GET', '/api/session').then(function (r) {
    if (r.body.authed) { csrf = r.body.csrf; start(); } else { show(false); }
  });
})();
</script>
</body>
</html>
